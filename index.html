<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>超高性能バーコードリーダー</title>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  <style>
    /* 画面全体で崩れないようにベースを固定 */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #111; font-family: Arial, sans-serif; overflow: hidden; }
    
    h1 { color: #fff; font-size: 1.2rem; margin: 0; padding: 15px 0; background: #222; text-align: center; }
    
    /* カメラ映像をスマホ画面（縦長）の真ん中に綺麗に収める設定 */
    #interactive { width: 100%; height: calc(100% - 150px); position: relative; background: #000; display: flex; align-items: center; overflow: hidden; }
    #interactive video { width: 100% !important; height: auto !important; object-fit: contain; }
    
    /* スキャン枠：画面のど真ん中に綺麗な「正方形」で配置（縦でも横でも入りやすい） */
    #scan-frame { position: absolute; top: 50%; left: 50%; width: 240px; height: 240px; margin-top: -120px; margin-left: -120px; border: 4px solid #00ea47; box-sizing: border-box; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); pointer-events: none; z-index: 10; }
    
    /* テキストやボタンを配置する下部エリア */
    .bottom-area { position: absolute; bottom: 0; left: 0; width: 100%; height: 95px; background: #222; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; padding: 5px; }
    #result { font-weight: bold; color: #00ea47; font-size: 0.95rem; text-align: center; white-space: pre-wrap; margin: 0; }
    #loading { display: none; color: #ffeb3b; font-weight: bold; font-size: 1rem; }
    .btn { display: none; padding: 10px 20px; font-size: 1rem; background-color: #007bc8; color: white; border: none; border-radius: 5px; cursor: pointer; -webkit-appearance: none; margin-top: 5px; }
    
    /* 不要UIの削除 */
    #reader__dashboard_section_swaplink, #reader input[type="file"], #reader img[alt="Camera inscriptions"] { display: none !important; }
  </style>
</head>
<body>

  <h1>バーコード スキャナー</h1>
  
  <div id="interactive" class="viewport">
    <div id="scan-frame"></div>
  </div>
  
  <div class="bottom-area">
    <div id="loading">スプレッドシートに転送中...</div>
    <p id="result">バーコードを緑の枠に合わせてください<br>（縦向き・逆さまでもOK）</p>
    <button id="restartBtn" class="btn" onclick="startScanner()">次のバーコードをスキャン</button>
  </div>

  <script>
    const gasUrl = "https://script.google.com/macros/s/AKfycbzW8ChXz-VMYfjgsiEqBUCK_bqbstqBwTcxeVmwlKQKa_519inW3pzRMCJWhS-MwDu0/exec";
    
    function startScanner() {
      document.getElementById('restartBtn').style.display = 'none';
      document.getElementById('result').innerHTML = "バーコードを緑の枠に合わせてください<br>（縦向き・逆さまでもOK）";
      document.getElementById('result').style.color = "#00ea47";

      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: {
            facingMode: "environment",
            width: { ideal: 640 },  // スマホに合わせた現実的な解像度に調整して歪みを防止
            height: { ideal: 480 }
          },
        },
        decoder: {
          readers: ["ean_reader", "ean_8_reader"],
          multiple: false
        },
        locate: true,
        halfSample: true // 処理速度アップと画面フィットを優先
      }, function(err) {
        if (err) {
          document.getElementById('result').innerText = "カメラの起動に失敗しました。";
          return;
        }
        Quagga.start();
      });
    }

    // 誤認識（逆さまでの数字間違い）を完全に防ぐフィルター
    let bcdCount = {};
    Quagga.onDetected(function(result) {
      const code = result.codeResult.code;
      if (code.length !== 13 && code.length !== 8) return;

      // 3回連続で同じ数字が読めたら確定
      bcdCount[code] = (bcdCount[code] || 0) + 1;
      if (bcdCount[code] >= 3) {
        bcdCount = {};
        onScanSuccess(code);
      }
    });

    function onScanSuccess(barcodeText) {
      Quagga.stop();

      document.getElementById('loading').style.display = 'block';
      document.getElementById('result').innerText = "確定: " + barcodeText + "\n送信中...";

      fetch(gasUrl, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ barcode: barcodeText })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        if (data.status === "success") {
          document.getElementById('result').innerText = "保存完了！\n" + data.message;
        } else {
          document.getElementById('result').innerText = "エラー: " + data.message;
        }
        document.getElementById('restartBtn').style.display = 'block';
      })
      .catch(error => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result').innerText = "送信完了しました。";
        document.getElementById('restartBtn').style.display = 'block';
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      startScanner();
    });
  </script>
</body>
</html>
