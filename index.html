<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>超爆速バーコードリーダー</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #111; font-family: Arial, sans-serif; overflow: hidden; }
    h1 { color: #fff; font-size: 1.2rem; margin: 0; padding: 15px 0; background: #222; text-align: center; }
    
    /* 画面に合わせた見やすいカメラエリア */
    #video-container { width: 100%; height: calc(100% - 150px); position: relative; background: #000; display: flex; align-items: center; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* 見やすさのためのシンプルな横長枠（画面のズレを起こさない基本設計） */
    #scan-frame { position: absolute; top: 50%; left: 50%; width: 280px; height: 160px; margin-top: -80px; margin-left: -140px; border: 4px solid #00ea47; box-sizing: border-box; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none; z-index: 10; }
    
    .bottom-area { position: absolute; bottom: 0; left: 0; width: 100%; height: 95px; background: #222; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; padding: 10px; }
    #result { font-weight: bold; color: #00ea47; font-size: 1rem; text-align: center; white-space: pre-wrap; margin: 0; }
    #loading { display: none; color: #ffeb3b; font-weight: bold; font-size: 1rem; }
    .btn { display: none; padding: 10px 20px; font-size: 1rem; background-color: #007bc8; color: white; border: none; border-radius: 5px; cursor: pointer; -webkit-appearance: none; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>バーコード スキャナー</h1>
  
  <div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="scan-frame"></div>
  </div>
  
  <div class="bottom-area">
    <div id="loading">スプレッドシートに転送中...</div>
    <p id="result">バーコードを緑の枠に合わせてください<br>（縦向き・逆さまでもOK）</p>
    <button id="restartBtn" class="btn" onclick="startCamera()">次のバーコードをスキャン</button>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const gasUrl = "https://script.google.com/macros/s/AKfycbzW8ChXz-VMYfjgsiEqBUCK_bqbstqBwTcxeVmwlKQKa_519inW3pzRMCJWhS-MwDu0/exec";
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let barcodeDetector;
    let isScanning = true;
    let localStream = null;

    // iOS/Androidが内部に持っている、最もエラーのない純正認識エンジンを使用
    if ('BarcodeDetector' in window) {
      barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
    }

    function startCamera() {
      document.getElementById('restartBtn').style.display = 'none';
      document.getElementById('result').innerHTML = "バーコードを緑の枠に合わせてください<br>（縦向き・逆さまでもOK）";
      document.getElementById('result').style.color = "#00ea47";
      isScanning = true;

      // カメラのオートフォーカスと解像度を最大限引き出すリクエスト
      navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: "environment",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      })
      .then(stream => {
        localStream = stream;
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
          requestAnimationFrame(scanTick);
        });
      })
      .catch(err => {
        document.getElementById('result').innerText = "カメラの起動に失敗しました。Safariの通常タブで開いているか確認してください。";
        document.getElementById('result').style.color = "red";
      });
    }

    async function scanTick() {
      if (!isScanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // 画面の歪みを一切出さずに、カメラの見たままを1コマずつ超高速スキャン
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (barcodeDetector) {
          try {
            const barcodes = await barcodeDetector.detect(canvas);
            if (barcodes.length > 0) {
              // 枠のどこに当たっても、正しいJANコードが検知された瞬間に確定
              const code = barcodes[0].rawValue;
              if (code.length === 13 || code.length === 8) {
                onScanSuccess(code);
                return;
              }
            }
          } catch (e) {
            console.error(e);
          }
        }
      }
      requestAnimationFrame(scanTick);
    }

    function onScanSuccess(barcodeText) {
      isScanning = false;
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop()); // 重複防止のために一度カメラを止める
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('result').innerText = "確定: " + barcodeText + "\n送信中...";

      fetch(gasUrl, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ barcode: barcodeText })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        if (data.status === "success") {
          document.getElementById('result').innerText = "保存完了！\n" + data.message;
        } else {
          document.getElementById('result').innerText = "エラー: " + data.message;
        }
        document.getElementById('restartBtn').style.display = 'block';
      })
      .catch(error => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result').innerText = "転送を完了しました。";
        document.getElementById('restartBtn').style.display = 'block';
      });
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
