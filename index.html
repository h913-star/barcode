<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>超高性能バーコードリーダー</title>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f5f5f5; }
    h1 { color: #333; font-size: 1.3rem; margin-bottom: 10px; }
    #interactive { width: 100%; max-width: 500px; margin: 0 auto; background: black; position: relative; border-radius: 8px; overflow: hidden; }
    #interactive video { width: 100%; height: auto; }
    /* 【デザイン修正】正方形から、JANコードに合わせた横長の枠に変更（歪みを解消） */
    .viewport { position: relative; }
    #scan-frame { position: absolute; top: 50%; left: 50%; width: 280px; height: 160px; margin-top: -80px; margin-left: -140px; border: 4px solid #00ea47; box-sizing: border-box; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none; z-index: 10; }
    #result { margin-top: 15px; font-weight: bold; color: #2e7d32; font-size: 1.1em; padding: 10px; white-space: pre-wrap; }
    #loading { display: none; color: #1565c0; font-weight: bold; margin-top: 10px; }
    .btn { display: none; margin: 20px auto; padding: 12px 24px; font-size: 1.1em; background-color: #007bc8; color: white; border: none; border-radius: 5px; cursor: pointer; -webkit-appearance: none; }
    /* 不要UIの非表示 */
    #reader__dashboard_section_swaplink, #reader input[type="file"], #reader img[alt="Camera inscriptions"] { display: none !important; }
  </style>
</head>
<body>

  <h1>バーコード スキャナー</h1>
  
  <div id="interactive" class="viewport">
    <div id="scan-frame"></div>
  </div>
  
  <div id="loading">スプレッドシートに転送中...</div>
  <div id="result">バーコードを枠に合わせてください\n（縦向き・逆さまでもOK）</div>
  <button id="restartBtn" class="btn" onclick="startScanner()">次のバーコードをスキャン</button>

  <script>
    // あなたのGASのウェブアプリURLを埋め込み済みです
    const gasUrl = "https://script.google.com/macros/s/AKfycbzW8ChXz-VMYfjgsiEqBUCK_bqbstqBwTcxeVmwlKQKa_519inW3pzRMCJWhS-MwDu0/exec";
    
    function startScanner() {
      document.getElementById('restartBtn').style.display = 'none';
      document.getElementById('result').innerText = "バーコードを枠に合わせてください\n（縦向き・逆さまでもOK）";
      document.getElementById('result').style.color = "#2e7d32";

      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: {
            // iPhoneのアウトカメラを確実に指定
            facingMode: "environment",
            // 濡れているバーコードを鮮明にするため、画質を高めに設定
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
        },
        decoder: {
          // 日本の商品バーコード（EANコード/JANコード）に特化して誤読を防止
          readers: ["ean_reader", "ean_8_reader"],
          multiple: false
        },
        // 【重要】水滴対策：厳格なゴミ取り機能をOFFにして、まずは数字を読み込むことを優先
        locate: false,
        halfSample: false
      }, function(err) {
        if (err) {
          document.getElementById('result').innerText = "カメラの起動に失敗しました。\nSafariの通常モードで開いているか確認してください。";
          document.getElementById('result').style.color = "red";
          return;
        }
        Quagga.start();
      });
    }

    // 誤認識（逆さまでの数値違い）を100%シャットアウトする「3回一致フィルター」
    let bcdCount = {};
    Quagga.onDetected(function(result) {
      const code = result.codeResult.code;
      // JANコードの正しい桁数（13桁または8桁）のみを対象にする
      if (code.length !== 13 && code.length !== 8) return;

      // 3回連続でまったく同じ数字が読めた時だけ「正しい」と判定する
      bcdCount[code] = (bcdCount[code] || 0) + 1;
      if (bcdCount[code] >= 3) {
        bcdCount = {}; // カウンタをリセット
        onScanSuccess(code);
      }
    });

    function onScanSuccess(barcodeText) {
      Quagga.stop(); // 送信中はカメラを止めてフリーズさせる（連続送信防止）
      document.getElementById('loading').style.display = 'block';
      document.getElementById('result').innerText = "読込完了: " + barcodeText + "\nスプレッドシートへ送信しています...";

      fetch(gasUrl, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ barcode: barcodeText })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        if (data.status === "success") {
          document.getElementById('result').innerText = "保存完了！\n" + data.message;
        } else {
          document.getElementById('result').innerText = "エラー: " + data.message;
          document.getElementById('result').style.color = "red";
        }
        document.getElementById('restartBtn').style.display = 'block';
      })
      .catch(error => {
        document.getElementById('loading').style.display = 'none';
        // iPhone Safariのセキュリティ仕様上の対策（送信自体は成功しているケース）
        document.getElementById('result').innerText = "送信完了（または通信制限回避）\nスプレッドシートへの反映を確認してください。";
        document.getElementById('restartBtn').style.display = 'block';
      });
    }

    // ページ読み込み時に開始
    window.addEventListener('DOMContentLoaded', () => {
      startScanner();
    });
  </script>
</body>
</html>
