<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AppSheet風バーコードリーダー</title>
  <style>
    /* AppSheetのように画面全体をカメラにするためのリセット */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; font-family: Arial, sans-serif; overflow: hidden; }
    
    /* カメラ映像を画面いっぱいに広げる（全画面表示） */
    #video-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* AppSheet風のシンプルなスキャンエリア（中央の細めの枠） */
    #scan-frame { position: absolute; top: 50%; left: 50%; width: 280px; height: 140px; margin-top: -70px; margin-left: -140px; border: 2px solid #00ea47; box-sizing: border-box; border-radius: 4px; pointer-events: none; z-index: 10; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); }
    
    /* スキャンエリア中央を走るレーザー風の赤い線 */
    #scan-line { position: absolute; top: 50%; left: 50%; width: 270px; height: 2px; background-color: #ff3b30; margin-left: -135px; box-shadow: 0 0 4px #ff3b30; z-index: 11; pointer-events: none; }
    
    /* 下部のステータス表示 */
    .status-overlay { position: absolute; bottom: 30px; left: 0; width: 100%; text-align: center; z-index: 20; pointer-events: none; }
    #result { display: inline-block; background: rgba(0,0,0,0.7); color: #fff; font-weight: bold; font-size: 0.9rem; padding: 10px 20px; border-radius: 20px; margin: 0; max-width: 80%; white-space: pre-wrap; }
    #loading { display: none; color: #ffeb3b; font-weight: bold; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 20px; }
    
    /* 次のスキャンボタン（画面中央に浮かせる） */
    .btn-overlay { position: absolute; top: 70%; left: 0; width: 100%; text-align: center; z-index: 30; }
    .btn { display: none; margin: 0 auto; padding: 12px 30px; font-size: 1.1rem; background-color: #1a73e8; color: white; border: none; border-radius: 24px; cursor: pointer; -webkit-appearance: none; box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-weight: bold; }
  </style>
</head>
<body>

  <div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="scan-frame"></div>
    <div id="scan-line"></div>
  </div>
  
  <div class="status-overlay">
    <div id="loading">スプレッドシートに転送中...</div>
    <p id="result">バーコードを枠に合わせてください<br>(縦・横どちらでもOK)</p>
  </div>

  <div class="btn-overlay">
    <button id="restartBtn" class="btn" onclick="startCamera()">タップして次のスキャン</button>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>
  <canvas id="canvas-rot" style="display:none;"></canvas>

  <script>
    const gasUrl = "https://script.google.com/macros/s/AKfycbzW8ChXz-VMYfjgsiEqBUCK_bqbstqBwTcxeVmwlKQKa_519inW3pzRMCJWhS-MwDu0/exec";
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const canvasRot = document.getElementById('canvas-rot');
    const ctxRot = canvasRot.getContext('2d');
    
    let barcodeDetector;
    let isScanning = true;
    let localStream = null;

    // ブラウザ・スマホ標準の最強認識エンジンを起動
    if ('BarcodeDetector' in window) {
      barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
    } else {
      alert("最新のSafari環境で開いてください。");
    }

    function startCamera() {
      document.getElementById('restartBtn').style.display = 'none';
      document.getElementById('result').innerHTML = "バーコードを枠に合わせてください<br>(縦・横どちらでもOK)";
      isScanning = true;

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      })
      .then(stream => {
        localStream = stream;
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
          requestAnimationFrame(scanTick);
        });
      })
      .catch(err => {
        document.getElementById('result').innerText = "カメラの起動に失敗しました。";
      });
    }

    async function scanTick() {
      if (!isScanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // 1. 通常（横向き）の画像を解析
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (barcodeDetector) {
          try {
            let barcodes = await barcodeDetector.detect(canvas);
            if (barcodes.length > 0) {
              onScanSuccess(barcodes[0].rawValue);
              return;
            }

            // 2. 【縦向きバーコード対策】画像を内部で90度回転させて同時スキャン！
            canvasRot.width = video.videoHeight;
            canvasRot.height = video.videoWidth;
            ctxRot.translate(canvasRot.width / 2, canvasRot.height / 2);
            ctxRot.rotate(90 * Math.PI / 180);
            ctxRot.drawImage(video, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
            ctxRot.setTransform(1, 0, 0, 1, 0, 0); // リセット

            barcodes = await barcodeDetector.detect(canvasRot);
            if (barcodes.length > 0) {
              onScanSuccess(barcodes[0].rawValue);
              return;
            }
          } catch (e) {
            console.error(e);
          }
        }
      }
      requestAnimationFrame(scanTick);
    }

    function onScanSuccess(barcodeText) {
      isScanning = false;
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop()); // カメラを一時止め
      }

      // iPhoneの標準バイブレーションをシミュレート（読み取り通知）
      if (navigator.vibrate) navigator.vibrate(200);

      document.getElementById('loading').style.display = 'block';
      document.getElementById('result').innerText = "読込完了: " + barcodeText;

      fetch(gasUrl, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ barcode: barcodeText })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        if (data.status === "success") {
          document.getElementById('result').innerText = "保存完了！\n" + data.message;
        } else {
          document.getElementById('result').innerText = "エラー: " + data.message;
        }
        document.getElementById('restartBtn').style.display = 'block';
      })
      .catch(error => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result').innerText = "スプレッドシートへ送信しました。";
        document.getElementById('restartBtn').style.display = 'block';
      });
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
