<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>超爆速JANリーダー</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f5f5f5; }
    h1 { color: #333; font-size: 1.3rem; margin-bottom: 10px; }
    #video-container { width: 100%; max-width: 500px; margin: 0 auto; background: black; position: relative; border-radius: 8px; overflow: hidden; line-height: 0; }
    video { width: 100%; height: auto; }
    /* スキャン枠（正方形に近くして、縦でも横でも収まるように調整） */
    #scan-frame { position: absolute; top: 50%; left: 50%; width: 240px; height: 240px; margin-top: -120px; margin-left: -120px; border: 4px solid #00ea47; box-sizing: border-box; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none; }
    #result { margin-top: 15px; font-weight: bold; color: #2e7d32; font-size: 1.1em; padding: 10px; white-space: pre-wrap; }
    #loading { display: none; color: #1565c0; font-weight: bold; margin-top: 10px; }
    .btn { display: none; margin: 20px auto; padding: 12px 24px; font-size: 1.1em; background-color: #007bc8; color: white; border: none; border-radius: 5px; cursor: pointer; -webkit-appearance: none; }
  </style>
</head>
<body>

  <h1>バーコード スキャナー</h1>
  
  <div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="scan-frame"></div>
  </div>
  
  <div id="loading">スプレッドシートに転送中...</div>
  <div id="result">カメラを起動しています...</div>
  <button id="restartBtn" class="btn" onclick="restartScan()">次のバーコードをスキャン</button>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const gasUrl = "https://script.google.com/macros/s/AKfycbzW8ChXz-VMYfjgsiEqBUCK_bqbstqBwTcxeVmwlKQKa_519inW3pzRMCJWhS-MwDu0/exec";
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let barcodeDetector;
    let isScanning = true;
    let localStream = null;

    // Apple/Android純正の超高性能スキャナーを準備（縦横・斜めすべてに対応）
    if ('BarcodeDetector' in window) {
      barcodeDetector = new BarcodeDetector({ 
        formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] 
      });
    } else {
      alert("お使いのブラウザは高性能スキャンに対応していません。Safariを最新にアップデートしてください。");
    }

    function startCamera() {
      document.getElementById('restartBtn').style.display = 'none';
      document.getElementById('result').innerText = "バーコードを緑の枠に合わせてください\n（縦向きでもOK）";
      document.getElementById('result').style.color = "#2e7d32";
      isScanning = true;

      // オートフォーカスと高解像度を要求
      navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: { exact: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      })
      .then(stream => {
        localStream = stream;
        video.srcObject = stream;
        video.addEventListener('loadedmetadata', () => {
          requestAnimationFrame(scanTick);
        });
      })
      .catch(err => {
        // 万が一エラーが出た場合のフォールバック
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
        .then(stream => {
          localStream = stream;
          video.srcObject = stream;
          video.addEventListener('loadedmetadata', () => {
            requestAnimationFrame(scanTick);
          });
        });
      });
    }

    async function scanTick() {
      if (!isScanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (barcodeDetector) {
          try {
            // iOS内部のAIでバーコードを検知（一瞬で判別します）
            const barcodes = await barcodeDetector.detect(canvas);
            if (barcodes.length > 0) {
              onScanSuccess(barcodes[0].rawValue);
              return;
            }
          } catch (e) {
            console.error(e);
          }
        }
      }
      requestAnimationFrame(scanTick);
    }

    function onScanSuccess(barcodeText) {
      isScanning = false;
      
      // カメラのストリームを一時停止してフリーズさせる（連続送信防止）
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('result').innerText = "読み取り完了: " + barcodeText + "\nスプレッドシートへ送信中...";

      fetch(gasUrl, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ barcode: barcodeText })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        if (data.status === "success") {
          document.getElementById('result').innerText = "保存完了！\n" + data.message;
        } else {
          document.getElementById('result').innerText = "GASエラー: " + data.message;
          document.getElementById('result').style.color = "red";
        }
        document.getElementById('restartBtn').style.display = 'block';
      })
      .catch(error => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result').innerText = "スプレッドシートへ送信しました。\n（確認してください）";
        document.getElementById('result').style.color = "#1565c0";
        document.getElementById('restartBtn').style.display = 'block';
      });
    }

    function restartScan() {
      startCamera();
    }

    window.addEventListener('DOMContentLoaded', () => {
      startCamera();
    });
  </script>
</body>
</html>
